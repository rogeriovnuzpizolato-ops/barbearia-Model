<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
<link rel="icon" sizes="192x192" href="/web-app-manifest-192x192.png">
<link rel="icon" sizes="512x512" href="/web-app-manifest-512x512.png">
<link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="css/style.css" />
    <script src="/js/script.js" defer></script>
    <title>Barbearia Model</title>
  </head>
  <body>
    <header class="home__header hidden">
      <nav>
        <div class="links__nav">
          <a href="index.html">Home</a>
          <a href="servicos.html">Serviços</a>
          <a href="sobreNos.html">Sobre nos</a>
          <a class="select" href="contato.html">Contato</a>
        </div>
      </nav>
      <section class="div__logo">
        <a href="index.html">
          <img
            src="/img/logo-barbearia-escrita.png"
            alt="palavra barbearia escrita em dourado e Model escrita com letras brancas"
            class="hero"
          />
        </a>
      </section>
      <section class="home__text">
        <div class="home__titlle">
          <p class="text">O seu estilo começa aqui</p>
        </div>
      </section>
    </header>
    <main>
      <section class="hero__page">
        <div class="img__hero">
          <img src="img/saguao-barbearia-Model.png" alt="" />
        </div>
      </section>
      <section class="hidden contato__container">
        <form class="form__contato" action="" method="get">
          <fieldset class="fieldset_form">
            <legend class="legend_contato">Entre em Contato</legend>
            <div class="dados_pessoais">
              <label for="userName">Nome</label>
              <input type="text" name="userName" required placeholder="Nome" />
              <label for="userEmail">Email</label>
              <input
                type="email"
                name="userEmail"
                placeholder="digite seu email"
              />
              <label for="userPhoneNumber">Telefone</label>
              <input
                type="tel"
                name="userPhoneNumber"
                placeholder="digite seu Telefone"
                pattern="[0-9]{11}"
              />
            </div>

            <div class="form_info">
              <label for="assunto">Corte Desejado</label>
              <input type="text" name="assunto" required />

              <label for="userMsg">mensagen</label>
              <textarea
                name="userMsg"
                id="userMsg"
                placeholder="Digite sua mensagem"
              ></textarea>
            </div>

            <div class="contato_botoes">
              <button class="button_enviar" type="submit">Enviar</button>
              <button class="button_limpar" type="reset">Limpar</button>
            </div>
          </fieldset>
        </form>
      </section>
    </main>
    <footer>
      <section class="footer_logo">
        <div class="img_logo_footer">
          <img src="img/logo-barbearia-footer.png" alt="" />
        </div>
      </section>
      <section class="home__footer">
        <div class="footer_content">
          <p class="text color_2">
            site ficticio desenvolvido sem fins lucrativos <br>
            imagens geradas por IA
          </p>
          <p class="text color_2">projeto desenvolvido por Rogerio Luiz</p>
        </div>
      </section>
    </footer>
  </body>
</html>
